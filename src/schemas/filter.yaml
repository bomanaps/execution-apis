FilterResults:
  title: Filter results
  oneOf:
    - title: new block or transaction hashes
      type: array
      items:
        $ref: '#/components/schemas/hash32'
    - title: new logs
      type: array
      items:
        $ref: '#/components/schemas/Log'

Filter:
  title: filter
  oneOf:
    - title: Filter by block range
      type: object
      properties:
        fromBlock:
          title: from block
          $ref: '#/components/schemas/BlockNumberOrTagForRange'
        toBlock:
          title: to block
          $ref: '#/components/schemas/BlockNumberOrTagForRange'
        address:
          title: Address(es)
          oneOf:
            - title: Any Address
              type: 'null'
            - title: Address
              $ref: '#/components/schemas/address'
            - title: Addresses
              $ref: '#/components/schemas/addresses'
        topics:
          title: Topics
          $ref: '#/components/schemas/FilterTopics'
      not:
        required:
          - blockHash
    - title: Filter by block hash
      type: object
      properties:
        blockHash:
          title: block hash
          $ref: '#/components/schemas/hash32'
        address:
          title: Address(es)
          oneOf:
            - title: Any Address
              type: 'null'
            - title: Address
              $ref: '#/components/schemas/address'
            - title: Addresses
              $ref: '#/components/schemas/addresses'
        topics:
          title: Topics
          $ref: '#/components/schemas/FilterTopics'
      required:
        - blockHash

BlockRef:
  title: Block reference
  type: object
  required:
    - number
    - hash
    - parentHash
  additionalProperties: false
  properties:
    number:
      title: block number
      $ref: '#/components/schemas/uint'
    hash:
      title: block hash
      $ref: '#/components/schemas/hash32'
    parentHash:
      title: parent hash
      $ref: '#/components/schemas/hash32'

LogCursor:
  title: Log cursor
  description: Position in the log stream, after the log with `logIndex` in the block, or after the whole block if `logIndex` is omitted. After follows the direction of the scan.
  type: object
  required:
    - blockNumber
    - blockHash
  additionalProperties: false
  properties:
    blockNumber:
      title: block number
      $ref: '#/components/schemas/uint'
    blockHash:
      title: block hash
      description: Hash of the block, which lets the server detect that the client's chain was reorganized.
      $ref: '#/components/schemas/hash32'
    logIndex:
      title: log index
      description: Index within the block of the last log delivered.
      $ref: '#/components/schemas/uint'

LogsV2Direction:
  title: Direction
  type: string
  enum:
    - asc
    - desc
  description: '`asc`: Oldest log first, `from` is at or below `toBlock`; `desc`: Newest log first, `from` is at or above `toBlock`.'

LogField:
  title: Log field
  type: string
  enum:
    - address
    - topics
    - data
    - blockTimestamp
    - transactionHash
    - transactionIndex

LogsV2Filter:
  title: Logs V2 filter
  type: object
  required:
    - from
  additionalProperties: false
  properties:
    from:
      title: from
      description: Where the scan starts. A block number or tag starts at that block, inclusive. A cursor from a previous page resumes after it, and must be on the canonical chain.
      oneOf:
        - title: Start at a block
          $ref: '#/components/schemas/BlockNumberOrTagForRange'
        - title: Resume after a cursor
          $ref: '#/components/schemas/LogCursor'
    toBlock:
      title: to block
      description: Last block to scan, inclusive. Defaults to latest when ascending, and to the earliest available block when descending. A block past the head ends the page at the head.
      $ref: '#/components/schemas/BlockNumberOrTagForRange'
    direction:
      title: direction
      description: Order of the scan. Defaults to asc.
      $ref: '#/components/schemas/LogsV2Direction'
    address:
      title: Address(es)
      oneOf:
        - title: Any Address
          type: 'null'
        - title: Address
          $ref: '#/components/schemas/address'
        - title: Addresses
          $ref: '#/components/schemas/addresses'
    topics:
      title: Topics
      $ref: '#/components/schemas/FilterTopics'
    maxLogs:
      title: max logs
      description: Maximum number of logs to return. The server may return fewer.
      $ref: '#/components/schemas/uint'
    fields:
      title: fields
      description: Optional log fields to return. If omitted, all fields are returned.
      type: array
      items:
        $ref: '#/components/schemas/LogField'

LogV2:
  title: Log V2
  description: A log with its position, and the optional fields selected by the request. The fields of its block are in the blocks list of the result.
  type: object
  required:
    - blockNumber
    - logIndex
  additionalProperties: false
  properties:
    blockNumber:
      title: block number
      $ref: '#/components/schemas/uint'
    logIndex:
      title: log index
      $ref: '#/components/schemas/uint'
    address:
      title: address
      $ref: '#/components/schemas/address'
    topics:
      title: topics
      type: array
      items:
        $ref: '#/components/schemas/bytes32'
    data:
      title: data
      $ref: '#/components/schemas/bytes'
    transactionHash:
      title: transaction hash
      $ref: '#/components/schemas/hash32'
    transactionIndex:
      title: transaction index
      $ref: '#/components/schemas/uint'

LogBlock:
  title: Log block
  description: A block that contains logs of the page.
  type: object
  required:
    - number
    - hash
  additionalProperties: false
  properties:
    number:
      title: block number
      $ref: '#/components/schemas/uint'
    hash:
      title: block hash
      $ref: '#/components/schemas/hash32'
    timestamp:
      title: block timestamp
      description: Only returned if blockTimestamp is selected.
      $ref: '#/components/schemas/uint'

LogsV2Result:
  title: Logs V2 result
  type: object
  required:
    - logs
    - blocks
    - nextCursor
    - finalizedBlock
  additionalProperties: false
  properties:
    logs:
      title: logs
      type: array
      items:
        $ref: '#/components/schemas/LogV2'
    blocks:
      title: blocks
      description: Each block that contains logs of the page, once and in the order of the logs.
      type: array
      items:
        $ref: '#/components/schemas/LogBlock'
    nextCursor:
      title: next cursor
      description: Pass as from in the next request, with the same direction, to continue without gaps or overlaps.
      $ref: '#/components/schemas/LogCursor'
    finalizedBlock:
      title: finalized block
      description: The finalized block when the server executed the query, null if unknown.
      oneOf:
        - title: Unknown
          type: 'null'
        - title: Finalized block
          $ref: '#/components/schemas/BlockRef'

FilterTopics:
  title: Filter Topics
  oneOf:
    - title: Any Topic Match
      type: 'null'
    - title: Specified Filter Topics
      type: array
      items:
        $ref: '#/components/schemas/FilterTopic'

FilterTopic:
  title: Filter Topic List Entry
  oneOf:
    - title: Any Topic Match
      type: 'null'
    - title: Single Topic Match
      $ref: '#/components/schemas/bytes32'
    - title: Multiple Topic Match
      type: array
      items:
        $ref: '#/components/schemas/bytes32'
